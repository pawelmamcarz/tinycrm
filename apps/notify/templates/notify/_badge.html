{% comment %}Licznik nieprzeczytanych — fragment HTMX; sam odświeża się co 60 s (outerHTML).{% endcomment %}
<span id="notify-badge" hx-get="{% url 'notify:badge' %}" hx-trigger="every 60s" hx-swap="outerHTML"
      {% if count %}class="badge badge-error badge-sm" aria-label="Nieprzeczytane powiadomienia: {{ count }}"{% else %}class="hidden"{% endif %}>{% if count %}{% if count > 99 %}99+{% else %}{{ count }}{% endif %}{% endif %}</span>
