{% extends "base/base.html" %}
{% block title %}Logowanie · TinyCRM{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-16 card bg-base-100 shadow">
  <form method="post" class="card-body gap-3">{% csrf_token %}
    <h1 class="card-title text-2xl">TinyCRM</h1>
    {% if form.errors %}<div class="alert alert-error">Błędny login lub hasło.</div>{% endif %}
    <input name="username" class="input input-bordered" placeholder="Login" autofocus required>
    <input name="password" type="password" class="input input-bordered" placeholder="Hasło" required>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary">Zaloguj</button>
  </form>
</div>
{% endblock %}
