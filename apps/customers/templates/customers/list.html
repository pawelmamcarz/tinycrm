{% extends "base/base.html" %}
{% block title %}Klienci · TinyCRM{% endblock %}
{% block content %}
<div class="flex items-center justify-between gap-2 mb-3">
  <h1 class="text-2xl font-bold">🏥 Klienci</h1>
  {% if can_edit %}<a href="{% url 'customers:create' %}" class="btn btn-primary btn-sm">+ Nowy klient</a>{% endif %}
</div>
<form method="get" action="{% url 'customers:list' %}" class="card bg-base-100 shadow-sm mb-3"
      hx-get="{% url 'customers:list' %}" hx-target="#customer-results" hx-push-url="true"
      hx-trigger="input changed delay:300ms from:input[name=q], change from:input[type=checkbox], submit">
  <div class="card-body p-3 gap-2">
    <label class="input input-bordered flex items-center gap-2">
      <span aria-hidden="true">🔍</span>
      <input type="search" name="q" value="{{ q }}" class="grow" placeholder="Nazwa, miasto lub NIP" aria-label="Szukaj klienta" autocomplete="off">
    </label>
    <div class="flex flex-wrap gap-4">
      <label class="label cursor-pointer gap-2"><input type="checkbox" name="moi" value="1" class="toggle toggle-primary toggle-sm" {% if mine %}checked{% endif %}><span class="label-text">Moi klienci</span></label>
      <label class="label cursor-pointer gap-2"><input type="checkbox" name="nieaktywni" value="1" class="toggle toggle-sm" {% if show_inactive %}checked{% endif %}><span class="label-text">Pokaż nieaktywnych</span></label>
      <noscript><button class="btn btn-sm">Szukaj</button></noscript>
    </div>
  </div>
</form>
<div id="customer-results">{% include "customers/_list_results.html" %}</div>
{% endblock %}
