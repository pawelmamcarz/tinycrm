{% if page.has_other_pages %}
<div class="join mt-4">
  {% if page.has_previous %}<a class="join-item btn btn-sm" href="?{{ querystring }}{% if querystring %}&{% endif %}page={{ page.previous_page_number }}">«</a>{% endif %}
  <span class="join-item btn btn-sm btn-disabled">{{ page.number }} / {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="join-item btn btn-sm" href="?{{ querystring }}{% if querystring %}&{% endif %}page={{ page.next_page_number }}">»</a>{% endif %}
</div>
{% endif %}
